# KodBox web clients have session tools, not host administration or desktop apps.
- id: ui-cordis
  disabled: true
- id: cordis-client-runner
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-shell
  disabled: true
- id: ui-settings-account
  disabled: true
# Disable upstream pages; insert administrator-gated modules below.
- id: ui-settings-models
  disabled: true
- id: ui-settings-general
  disabled: true
- id: ui-settings-agent-loop
  disabled: true
- id: ui-settings-subagent
  disabled: true
- id: ui-settings-web-search
  disabled: true
- id: ui-settings-session-log
  disabled: true
# 0.2.1 adds a schedule surface and a prompt that names the server checkout.
- id: ui-schedule
  disabled: true
- id: harness-dev-context
  disabled: true

- insert:
    - id: kodbox-admin-settings-shell
      name: /opt/kodbox-dsh/integrations/kodbox-file/admin-settings-shell/index.js
    - id: kodbox-admin-models
      name: /opt/kodbox-dsh/integrations/kodbox-file/admin-models/index.js
    - id: kodbox-office-tools
      name: /opt/kodbox-dsh/integrations/kodbox-file/index.js
      config:
        apiBase: http://app/
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: off
